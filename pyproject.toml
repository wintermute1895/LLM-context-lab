[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LLM-context-lab"
version = "0.1.0"
description = "Local evidence-backed cross-session context prototype"
requires-python = ">=3.11"

[project.scripts]
context-lab = "context_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
